[colors]
;background = #282A2E
;background-alt = #373B41
;foreground = #C5C8C6
primary = #d8dee9
secondary = #8ABEB7
alert = #A54242
disabled = #707880
background = #2e3440
foreground = #d8dee9
background-alt = #3b4252



[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 30
radius = 0
offset-y = 0
fixed-center = true
; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

;border-size = 1pt
;border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

include-file = $HOME/.config/polybar/fonts.ini
#font-0 = MesloLGS Nerd Font:style=Normal:size=12;3
#font-1 = Noto Color Emoji:scale=14

modules-left = i3 title
modules-right = pulseaudio tray powermenu date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = false

; wm-restack = generic
; wm-restack = bspwm
;wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[bar/secondary]
monitor = ${env:MONITOR:}
width = 100%
height = 30
offset-y = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

include-file = $HOME/.config/polybar/fonts.ini

modules-left = title
modules-right = pulseaudio date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = false

[module/systray]
type = internal/tray

[module/powermenu]
type = custom/text

click-left = xfce4-session-logout
content = %{T9}⏻%{T-}
content-padding = 0.5

[module/tray]
type = internal/tray

format-margin = 1px
tray-spacing = 8px
tray-size = 16
tray-background = ${colors.background}
;format-margin = 8pt
;tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/i3]
type = internal/i3
index-sort = true

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${colors.primary}

label-focused = %{T2}%index%%{T-}
label-focused-foreground = ${colors.primary}
label-focused-padding = 1

label-unfocused = %{T2}%index%%{T-}
label-unfocused-foreground = ${colors.background-alt}
label-unfocused-padding = 1

label-visible = %{T2}%index%%{T-}
label-visible-foreground = ${colors.background-alt}
label-visible-padding = 1

label-urgent = %{T2}%index%%{T-}
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/title]
type = internal/xwindow

format = <label>
format-padding = 1
label = %{T2}%title%%{T-}
label-maxlen = 200

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/apulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

; Interval for volume increase/decrease (in percent points)
interval = 5

; Available tags: <label-volume>, <ramp-volume>, <bar-volume>
format-volume = <bar-volume> <label-volume>
format-volume-padding = 2px

; Available tags: <label-muted>, <ramp-volume>, <bar-volume>
format-muted = <label-muted>
format-muted-padding = 2px

label-volume = %{T2}%percentage%%%{T-}
label-volume-padding = 0

; Muted label
label-muted = MUTED
label-muted-foreground = #666

; Volume bar settings
bar-volume-width = 10
bar-volume-foreground-0 = #ff5555
bar-volume-foreground-1 = #ff7755
bar-volume-foreground-2 = #ff9955
bar-volume-foreground-3 = #ffbb55
bar-volume-foreground-4 = #ffdd55
bar-volume-foreground-5 = #ddff55
bar-volume-foreground-6 = #bbff55
bar-volume-foreground-7 = #99ff55
bar-volume-foreground-8 = #77ff55
bar-volume-foreground-9 = #55ff55
bar-volume-gradient = true
bar-volume-indicator = |
bar-volume-indicator-font = 2
bar-volume-fill = ─
bar-volume-fill-font = 2
bar-volume-empty = ─
bar-volume-empty-font = 2
bar-volume-empty-foreground = #55

; Right click to open pavucontrol
click-right = pavucontrol&
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
