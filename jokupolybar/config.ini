[global/wm]
;include-file = $HOME/.config/polybar/colors.ini
include-file = $HOME/.config/polybar/modules.ini

[colors]
background = #2e3440
foreground = #d8dee9

[bar/main]
#tray-position = right
#tray-padding =5
monitor = ${env:MONITOR:}
width =  100%
height = 20
padding-left =1
padding-right =1
background = ${colors.background}
foreground = ${colors.foreground}
bottom = false
border-top-size = 7
border-bottom-size = 7
border-top-color = ${colors.background}
border-bottom-color = ${colors.background}
offset-x = 1%
offset-y = 0.5%
fixed-center = true
line-size = 3

;wm-restack = i3

modules-left = i3 title
modules-center =  
modules-right = alsa space round-left time round-right powermenu round-left tray round-right

font-0 = JetBrainsMono Nerd Font:style=Bold:pixelsize=13;3
font-1 = JetBrainsMono Nerd Font:size=13;4
font-2 = Material Design Icons:style=Bold:size=13;3
font-3 = unifont:fontformat=truetype:size=13:antialias=true;
font-4 = "Noto Color Emoji:scale=14"

[bar/secondary]
#tray-position = right
#tray-padding =5
monitor = ${env:MONITOR:}
width =  100%
height = 20
padding-left =0
padding-right =1
background = ${colors.background}
foreground = ${colors.foreground}
bottom = false
border-top-size = 7
border-bottom-size = 7
border-top-color = ${colors.background}
border-bottom-color = ${colors.background}
offset-x = 1%
offset-y = 0.5%
fixed-center = true
line-size = 3

modules-left = title
modules-center =  
modules-right = alsa space round-left time round-right

font-0 = JetBrainsMono Nerd Font:style=Bold:pixelsize=13;3
font-1 = JetBrainsMono Nerd Font:size=13;4
font-2 = Material Design Icons:style=Bold:size=13;3
font-3 = unifont:fontformat=truetype:size=13:antialias=true;
font-4 = "Noto Color Emoji:scale=14"

